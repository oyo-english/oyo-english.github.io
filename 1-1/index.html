* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-explain); font-size: 16px; line-height: 24px; -webkit-text-size-adjust: 100%; }
p, h1, h2, h3, ul, ol { margin: 0; padding: 0; }
ul, ol { list-style: none; }
[lang="en"] { font-family: var(--font-practice); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.muted { color: var(--ink-muted); }
.note { font-size: 14px; line-height: 20px; color: var(--ink-muted); }
.label { font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); }
.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ic--sm { width: 16px; height: 16px; }

/* header */
.top { padding-block: var(--space-6) var(--space-4); display: flex; flex-direction: column; gap: var(--space-2); }
.brandrow { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); }
.wordmark { font-family: var(--font-practice); font-weight: 800; font-size: 20px; letter-spacing: -.02em; }
.lessonline { display: flex; align-items: flex-end; gap: var(--space-3); }
.lnum { font-family: var(--font-practice); font-weight: 800; font-size: 48px; line-height: .85; letter-spacing: -.03em; color: var(--brand-ink); }
.ltitle { font-family: var(--font-practice); font-weight: 800; font-size: 26px; line-height: 30px; letter-spacing: -.01em; text-wrap: balance; }
.speed { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--ink-muted); border-radius: var(--radius-pill); padding: 4px 12px; background: transparent; cursor: pointer; font-size: 14px; min-height: 36px; }
.speed[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.voicenote { font-size: 13px; line-height: 18px; color: var(--ink-muted); background: var(--surface-sunk); border-radius: var(--radius-sm); padding: 6px 10px; }

/* stage bar */
.stagebar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }
.stages { display: flex; gap: var(--space-2); overflow-x: auto; padding-block: var(--space-3); scrollbar-width: none; }
.stages::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 6px 14px 6px 6px; border-radius: var(--radius-pill); border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-size: 15px; font-weight: 700; white-space: nowrap; }
.chip .num { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--surface-sunk); font-size: 13px; }
.chip[aria-current="step"] { border-color: var(--ink); }
.chip[aria-current="step"] .num { background: var(--ink); color: var(--paper); }
.chip.done .num { background: var(--success); color: var(--paper); }

/* stage */
main { padding-block: var(--space-4) var(--space-8); display: flex; flex-direction: column; gap: var(--space-6); }
.stage-h { display: flex; flex-direction: column; gap: 4px; }
.stage-h h2 { font-size: 22px; line-height: 28px; font-weight: 700; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); }
.card h3 { font-size: 18px; line-height: 24px; font-weight: 700; }
.row { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
.between { justify-content: space-between; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 8px 18px; border-radius: var(--radius-pill); border: 1.5px solid var(--ink-muted); background: transparent; cursor: pointer; font-weight: 700; font-size: 16px; }
.btn--primary { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
.btn--ink { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn--ghost { border-color: transparent; padding-inline: 8px; color: var(--ink-muted); font-weight: 400; text-decoration: underline; text-underline-offset: 3px; min-height: 36px; }
.btn[disabled] { opacity: .45; cursor: default; }
.play { width: 48px; height: 48px; padding: 0; border-radius: 50%; flex: none; }
.play.playing { box-shadow: 0 0 0 4px var(--brand-tint); }
.next { align-self: stretch; }

/* tags */
.tier { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px 2px 6px; border-radius: var(--radius-sm); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.tier::before { content: ""; width: 8px; height: 8px; background: currentColor; flex: none; }
.tier--simple { color: var(--tier-simple); background: var(--tier-simple-tint); } .tier--simple::before { border-radius: 50%; }
.tier--natural { color: var(--tier-natural); background: var(--tier-natural-tint); }
.tier--polished { color: var(--tier-polished); background: var(--tier-polished-tint); } .tier--polished::before { width: 7px; height: 7px; transform: rotate(45deg); }

.en { font-family: var(--font-practice); font-size: 17px; line-height: 25px; }
.expr { font-family: var(--font-practice); font-size: 20px; line-height: 26px; font-weight: 700; }
.bubble { font-family: var(--font-practice); font-size: 17px; line-height: 25px; padding: 10px 16px; border-radius: 20px; background: var(--surface-sunk); }
.bubble--you { background: var(--brand-tint); }
.who { font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); }

/* choices */
.opts { display: flex; flex-direction: column; gap: var(--space-2); }

.opt .t { padding-top: 3px; min-width: 0; }
.opt .m { padding-top: 5px; }
.opt.right { border-color: var(--success); background: var(--success-tint); }
.opt.right .k { background: var(--success); color: var(--paper); }
.opt.right .m { color: var(--success); }
.opt.wrong { border-color: var(--danger); }

.fb { font-size: 16px; line-height: 23px; }

.score { font-weight: 700; }

.dlg { display: flex; flex-direction: column; gap: 10px; }
.turn { display: flex; flex-direction: column; gap: 3px; max-width: 88%; }
.turn--you { align-self: flex-end; align-items: flex-end; }
.turn.now .bubble { outline: 2px solid var(--brand); }

/* timer */
.bar { height: 8px; border-radius: var(--radius-pill); background: var(--surface-sunk); overflow: hidden; }
.bar > span { display: block; height: 100%; width: 0; background: var(--ink); border-radius: inherit; }
.cue { border: 1.5px solid var(--ink); border-radius: var(--radius-md); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.cue .en { font-weight: 700; }

/* mission */
.mission { padding: 0; overflow: hidden; gap: 0; }
.band { background: var(--brand); color: var(--on-brand); padding: 12px 16px; display: flex; align-items: center; gap: 8px; }
.band h3 { color: var(--on-brand); }
.mbody { padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); }
.levels { display: flex; flex-direction: column; gap: 10px; }
.levels li { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
textarea { width: 100%; min-height: 64px; resize: vertical; font: inherit; color: var(--ink); background: var(--surface-sunk); border: 1.5px solid var(--ink-muted); border-radius: var(--radius-sm); padding: 8px 10px; }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.check input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--success); flex: none; }
.rec { display: flex; flex-direction: column; gap: 6px; }
.rec input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }

.end { text-align: center; padding: var(--space-6) var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); align-items: center; }

.foot { padding-block: var(--space-6); border-top: 1px solid var(--line); }
@media (prefers-reduced-motion: reduce) { .bar > span { transition: none !important; } }

ms": [{"n": 1, "prompt": "Kofi: “Hi Awa, how are you?”", "hint": "Kofi vous demande comment ça va.", "correct": "B", "options": [{"key": "A", "text": "I'm fine, thank you. And you?", "feedback": "Correct, mais un peu scolaire dans ce moment détendu. B sonne plus naturel ici."}, {"key": "B", "text": "Good, thanks. How about you?", "feedback": "Oui : court, léger, et vous renvoyez la question."}, {"key": "C", "text": "Well, my son is sick, my car broke down, and…", "feedback": "Trop pour une salutation. Restez bref."}]}, {"n": 2, "prompt": "Kofi: “I went to Cape Coast this weekend.”", "hint": "Kofi vous dit qu'il est allé à Cape Coast ce week-end.", "correct": "B", "options": [{"key": "A", "text": "Okay.", "feedback": "La conversation s'arrête là."}, {"key": "B", "text": "Oh really? How did it go?", "feedback": "Oui : de l'intérêt + une question de suite."}, {"key": "C", "text": "Did you pass a good weekend?", "feedback": "Français traduit : « have a good weekend »."}]}, {"n": 3, "prompt": "Chidi joins the call. Everyone is here now.", "hint": "Chidi arrive. Tout le monde est là.", "correct": "A", "options": [{"key": "A", "text": "Looks like everyone's here.", "feedback": "Oui : une transition naturelle vers la réunion."}, {"key": "B", "text": "How do you do, Chidi?", "feedback": "Très formel et vieilli."}, {"key": "C", "text": "Good talking to you.", "feedback": "Ça termine la discussion, mais vous restez tous pour la réunion."}]}]}, {"id": "SUA-S01-L01-A02", "type": "spot_the_error", "prompt": "Quelles phrases ne conviennent pas ici : français traduit ou anglais trop scolaire ? Corrigez-les.", "items": [{"n": 1, "text": "Did you pass a good weekend?", "error": true, "fix": "Did you have a good weekend?"}, {"n": 2, "text": "Good, thanks. How about you?", "error": false, "fix": null}, {"n": 3, "text": "How do you do, Kofi?", "error": true, "fix": "How's it going, Kofi?"}, {"n": 4, "text": "Sorry for the delay, the traffic was terrible.", "error": true, "fix": "Sorry I'm late — the traffic was terrible."}, {"n": 5, "text": "Oh really? How did it go?", "error": false, "fix": null}]}]}, {"key": "Repeat", "label": "Répéter", "acts": [{"id": "SUA-S01-L01-A10", "type": "repeat", "instruction": "Écoutez. Répétez. Enregistrez-vous et comparez.", "checks": ["Ai-je dit l'expression en entier ?", "Ai-je parlé de façon amicale et détendue ?"]}]}, {"key": "Recall", "label": "Retrouver", "acts": [{"id": "SUA-S01-L01-A11", "type": "recall_timed", "instruction": "Lisez la situation. Réfléchissez 5 secondes. Dites votre réponse. Puis affichez la solution.", "think": 5, "items": [{"n": 1, "tier": "simple", "situation": "Chidi joins the call. Say hello and ask how things are.", "hint": "Chidi arrive. Saluez-le et demandez comment ça va.", "model": "Hi Chidi! How's it going?"}, {"n": 2, "tier": "simple", "situation": "Kofi asks: “How are you?” Answer and return the question.", "hint": "Kofi demande comment vous allez. Répondez et renvoyez la question.", "model": "Good, thanks. How about you?"}, {"n": 3, "tier": "simple", "situation": "It's Monday. Ask about the weekend.", "hint": "C'est lundi. Demandez comment s'est passé le week-end.", "model": "How was your weekend?"}, {"n": 4, "tier": "simple", "situation": "Kofi says he went to a wedding. Keep the conversation going.", "hint": "Kofi dit qu'il est allé à un mariage. Faites durer la conversation.", "model": "Oh really? How did it go?"}, {"n": 5, "tier": "natural", "situation": "Kofi works in Accra. Ask about his city.", "hint": "Kofi travaille à Accra. Demandez des nouvelles de sa ville.", "model": "How are things in Accra?"}, {"n": 6, "tier": "natural", "situation": "Everyone has joined. Move into the meeting.", "hint": "Tout le monde est arrivé. Passez à la réunion.", "model": "Looks like everyone's here."}]}]}, {"key": "Role-play", "label": "Jeu de rôle", "acts": [{"id": "SUA-S01-L01-A12", "type": "role_play", "title": "Lundi matin", "setup": "Vous êtes Awa. Vous rejoignez la visio en avance, /* ---------- DOM helper ---------- */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v; else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "html") el.innerHTML = v; else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(c));
  return el;
}
const ICON = {
  play: '<path d="M6 4l14 8-14 8z"/>', stop: '<rect x="6" y="6" width="12" height="12" rx="1"/>',
  check: '<path d="M20 6 9 17l-5-5"/>', x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',

function ic(n, cls) { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("class", "ic " + (cls || "")); s.setAttribute("aria-hidden", "true"); s.innerHTML = ICON[n]; if (n === "play" || n === "stop") s.style.fill = "currentColor"; return s; }
function en(text, cls) { // English practice line; French [slots] muted
  const el = h("span", { lang: "en", class: cls || "en" });

function tierTag(t) { return h("span", { class: "tier tier--" + t }, D.lesson.tiers[t]); }
const NAME = id => (D.cast[id] || {}).name || id;

/* ---------- audio: real clips when published, otherwise the phone's speech engine ---------- */
const Voice = {
  list: [], ready: false,
  init() { if (!("speechSynthesis" in window)) return; const load = () => { this.list = speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang)); }; load(); try { speechSynthesis.addEventListener("voiceschanged", load); } catch (e) {} },
  pick(sp) {
    const prefs = { kofi: ["en-GH", "en-NG", "en-ZA", "en-GB"], chidi: ["en-NG", "en-ZA", "en-GB"], awa: ["en-GB", "en-US"], mariam: ["en-GB", "en-US"], grace: ["en-KE", "en-TZ", "en-GB"] }[sp] || ["en-GB", "en-US"];
    for (const p of prefs) { const m = this.list.filter(v => v.lang.replace("_", "-").toLowerCase() === p.toLowerCase()); if (m.length) return m[(sp.length) % m.length]; }
    return this.list[0] || null;
  },
  pitch: { kofi: .85, chidi: .75, awa: 1.15, mariam: 1.2, grace: 1.05 }
};
Voice.init();
let current = null, currentDone = null;
const player = new Audio();   // one shared player for every model line (more reliable on phones than a new player per line)
player.preload = "auto";
function setSession(t) { try { if (navigator.audioSession) navigator.audioSession.type = t; } catch (e) {} }
function stopAudio() {
  try { speechSynthesis.cancel(); } catch (e) {}
  try { player.pause(); } catch (e) {}
  current = null; const done = currentDone; currentDone = null; if (done) done();   // always release the button that was playing
}
function pauseRecordings() { document.querySelectorAll(".rec audio").forEach(x => { try { x.pause(); } catch (e) {} }); }
function play(text, speaker, id) {
  stopAudio(); pauseRecordings(); setSession("playback");
  return new Promise(resolve => {
    let finished = false;
    const done = () => { if (finished) return; finished = true; if (currentDone === done) currentDone = null; resolve(); };
    currentDone = done;
    const clipSrc = D.clips && D.clips[speaker + "|" + text];
    if (clipSrc) {
      current = player;
      player.onended = player.onerror = player.onpause = done;
      if (player.src !== clipSrc) player.src = clipSrc; else player.currentTime = 0;
      player.playbackRate = S.slow ? .8 : 1; player.preservesPitch = true;
      const p = player.play(); if (p && p.catch) p.catch(done);
      return;
    }
    if (!("speechSynthesis" in window)) { done(); return; }
    const u = new SpeechSynthesisUtterance(String(text).replace(/[—–]$/, "").replace(/\[[^\]]+\]/g, "…"));
    const v = Voice.pick(speaker); if (v) u.voice = v; u.lang = v ? v.lang : "en-GB";
    u.rate = S.slow ? .78 : .95; u.pitch = Voice.pitch[speaker] || 1;

    u.onend = u.onerror = () => { clearTimeout(guard); done(); }; current = u; speechSynthesis.speak(u);
  });
}
function playBtn(getText, speaker, id, label) {
  const b = h("button", { class: "btn btn--ink play", type: "button", "aria-label": label || "Écouter" }, ic("play"));
  b.addEventListener("click", async () => {
    if (b.classList.contains("playing")) { stopAudio(); return; }
    b.classList.add("playing"); b.replaceChildren(ic("stop"));
    await play(typeof getText === "function" ? getText() : getText, speaker, id);

/* ---------- shared pieces ---------- */
const tally = {};
function choice(opts, correct, actId, onDone, englishOpts) {
  const fb = h("p", { class: "fb", hidden: true });
  const list = h("div", { class: "opts" });
  opts.forEach(o => {
    const b = h("button", { class: "opt", type: "button" }, h("span", { class: "k" }, o.key), h("span", { class: "t" }, englishOpts ? en(o.text) : o.text), h("span", { class: "m" }));
    b.addEventListener("click", () => {
      if (list.classList.contains("locked")) return;
      list.classList.add("locked");
      const ok = o.key === correct;
      tally[actId] = tally[actId] || { ok: 0, n: 0 }; tally[actId].n++; if (ok) tally[actId].ok++;
      [...list.children].forEach((x, i) => { x.disabled = true; if (opts[i].key === correct) { x.classList.add("right"); x.querySelector(".m").append(ic("check")); } });
      if (!ok) { b.classList.add("wrong"); b.querySelector(".m").append(ic("x")); }
      fb.replaceChildren(h("b", { class: ok ? "ok" : "no" }, ok ? "Correct. " : "Pas tout à fait. "), o.feedback || "");
      if (!ok) { const r = opts.find(x => x.key === correct); if (r && r.feedback) fb.append(h("br"), h("b", {}, "Réponse " + correct + " : "), r.feedback); else fb.append(" Bonne réponse : " + correct + "."); }
      fb.hidden = false; onDone && onDone(ok);
    });
    list.append(b);
  });
  return h("div", { class: "opts-wrap", style: "display:flex;flex-direction:column;gap:10px" }, list, fb);
}
