/* OYO practice web — design system v1, "Practice web (dark)" first, "Book (light)" when the viewer prefers light.
   Layout: one narrow column (phone first), a sticky stage bar, one stage on screen at a time. */
:root {
  --paper:#12172a; --surface:#1a2138; --surface-sunk:#0e1222; --line:#2c3550; --ink:#f3eee6; --ink-muted:#a9b0c3;

  --tier-polished:#a99bf0; --tier-polished-tint:#241d45;
  --danger:#ff8a80; --danger-tint:#3d1715; --caution:#f2b45a; --caution-tint:#3a2a10; --success:#5bc4e8; --success-tint:#0f2d3a;
  --focus-ring:var(--ink);
  --font-practice:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --font-explain:"Atkinson Hyperlegible", ui-sans-serif, system-ui, sans-serif;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-6:24px; --space-8:32px;
  --radius-sm:6px; --radius-md:12px; --radius-pill:999px;
  color-scheme: dark;
}

  --brand:#e85e33; --on-brand:#17203a; --brand-ink:#b23f1a; --brand-tint:#fce7de;
  --tier-simple:#17795f; --tier-simple-tint:#e1f2ec; --tier-natural:#1f5fad; --tier-natural-tint:#e4edf9;
  --tier-polished:#5b45b0; --tier-polished-tint:#ece8f8;
  --danger:#b42318; --danger-tint:#fce8e6; --caution:#8f5300; --caution-tint:#fbf0da; --success:#0b6e99; --success-tint:#e2f1f8;
  color-scheme: light; } }
:root[data-theme="light"] {
  --paper:#fbf8f3; --surface:#ffffff; --surface-sunk:#f3eee6; --line:#e4dccf; --ink:#17203a; --ink-muted:#545b70;

  --tier-simple:#17795f; --tier-simple-tint:#e1f2ec; --tier-natural:#1f5fad; --tier-natural-tint:#e4edf9;
  --tier-polished:#5b45b0; --tier-polished-tint:#ece8f8;
  --danger:#b42318; --danger-tint:#fce8e6; --caution:#8f5300; --caution-tint:#fbf0da; --success:#0b6e99; --success-tint:#e2f1f8;
  color-scheme: light; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-explain); font-size: 16px; line-height: 24px; -webkit-text-size-adjust: 100%; }
p, h1, h2, h3, ul, ol { margin: 0; padding: 0; }
ul, ol { list-style: none; }
[lang="en"] { font-family: var(--font-practice); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.muted { color: var(--ink-muted); }
.note { font-size: 14px; line-height: 20px; color: var(--ink-muted); }
.label { font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); }
.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ic--sm { width: 16px; height: 16px; }

/* header */
.top { padding-block: var(--space-6) var(--space-4); display: flex; flex-direction: column; gap: var(--space-2); }
.brandrow { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); }
.wordmark { font-family: var(--font-practice); font-weight: 800; font-size: 20px; letter-spacing: -.02em; }
.lessonline { display: flex; align-items: flex-end; gap: var(--space-3); }
.lnum { font-family: var(--font-practice); font-weight: 800; font-size: 48px; line-height: .85; letter-spacing: -.03em; color: var(--brand-ink); }
.ltitle { font-family: var(--font-practice); font-weight: 800; font-size: 26px; line-height: 30px; letter-spacing: -.01em; text-wrap: balance; }
.speed { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--ink-muted); border-radius: var(--radius-pill); padding: 4px 12px; background: transparent; cursor: pointer; font-size: 14px; min-height: 36px; }
.speed[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.voicenote { font-size: 13px; line-height: 18px; color: var(--ink-muted); background: var(--surface-sunk); border-radius: var(--radius-sm); padding: 6px 10px; }

/* stage bar */
.stagebar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }
.stages { display: flex; gap: var(--space-2); overflow-x: auto; padding-block: var(--space-3); scrollbar-width: none; }
.stages::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 6px 14px 6px 6px; border-radius: var(--radius-pill); border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-size: 15px; font-weight: 700; white-space: nowrap; }
.chip .num { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--surface-sunk); font-size: 13px; }
.chip[aria-current="step"] { border-color: var(--ink); }
.chip[aria-current="step"] .num { background: var(--ink); color: var(--paper); }
.chip.done .num { background: var(--success); color: var(--paper); }

/* stage */
main { padding-block: var(--space-4) var(--space-8); display: flex; flex-direction: column; gap: var(--space-6); }
.stage-h { display: flex; flex-direction: column; gap: 4px; }
.stage-h h2 { font-size: 22px; line-height: 28px; font-weight: 700; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); }
.card h3 { font-size: 18px; line-height: 24px; font-weight: 700; }
.row { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
.between { justify-content: space-between; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 8px 18px; border-radius: var(--radius-pill); border: 1.5px solid var(--ink-muted); background: transparent; cursor: pointer; font-weight: 700; font-size: 16px; }
.btn--primary { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
.btn--ink { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn--ghost { border-color: transparent; padding-inline: 8px; color: var(--ink-muted); font-weight: 400; text-decoration: underline; text-underline-offset: 3px; min-height: 36px; }
.btn[disabled] { opacity: .45; cursor: default; }
.play { width: 48px; height: 48px; padding: 0; border-radius: 50%; flex: none; }
.play.playing { box-shadow: 0 0 0 4px var(--brand-tint); }
.next { align-self: stretch; }

/* tags */
.tier { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px 2px 6px; border-radius: var(--radius-sm); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.tier::before { content: ""; width: 8px; height: 8px; background: currentColor; flex: none; }
.tier--simple { color: var(--tier-simple); background: var(--tier-simple-tint); } .tier--simple::before { border-radius: 50%; }
.tier--natural { color: var(--tier-natural); background: var(--tier-natural-tint); }
.tier--polished { color: var(--tier-polished); background: var(--tier-polished-tint); } .tier--polished::before { width: 7px; height: 7px; transform: rotate(45deg); }

/* english lines */
.en { font-family: var(--font-practice); font-size: 17px; line-height: 25px; }
.expr { font-family: var(--font-practice); font-size: 20px; line-height: 26px; font-weight: 700; }
.bubble { font-family: var(--font-practice); font-size: 17px; line-height: 25px; padding: 10px 16px; border-radius: 20px; background: var(--surface-sunk); }
.bubble--you { background: var(--brand-tint); }
.who { font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); }
.slot { font-family: var(--font-explain); color: var(--ink-muted); font-size: .88em; }

/* choices */
.opts { display: flex; flex-direction: column; gap: var(--space-2); }
.opt { width: 100%; display: grid; grid-template-columns: 30px 1fr 22px; gap: var(--space-3); align-items: start; text-align: left; padding: 12px; border-radius: var(--radius-md); border: 1.5px solid var(--ink-muted); background: var(--surface); cursor: pointer; }
.opt .k { width: 30px; height: 30px; display: grid; place-items: center; border-radius: var(--radius-sm); background: var(--surface-sunk); font-weight: 700; font-size: 14px; }
.opt .t { padding-top: 3px; min-width: 0; }
.opt .m { padding-top: 5px; }
.opt.right { border-color: var(--success); background: var(--success-tint); }
.opt.right .k { background: var(--success); color: var(--paper); }
.opt.right .m { color: var(--success); }
.opt.wrong { border-color: var(--danger); }
.opt.wrong .m { color: var(--danger); }
.opts.locked .opt { cursor: default; }
.fb { font-size: 16px; line-height: 23px; }
.fb b.ok { color: var(--success); } .fb b.no { color: var(--danger); }
.score { font-weight: 700; }

/* dialogue */
.dlg { display: flex; flex-direction: column; gap: 10px; }
.turn { display: flex; flex-direction: column; gap: 3px; max-width: 88%; }
.turn--you { align-self: flex-end; align-items: flex-end; }
.turn.now .bubble { outline: 2px solid var(--brand); }

/* timer */
.bar { height: 8px; border-radius: var(--radius-pill); background: var(--surface-sunk); overflow: hidden; }
.bar > span { display: block; height: 100%; width: 0; background: var(--ink); border-radius: inherit; }
.cue { border: 1.5px solid var(--ink); border-radius: var(--radius-md); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.cue .en { font-weight: 700; }

/* mission */
.mission { padding: 0; overflow: hidden; gap: 0; }
.band { background: var(--brand); color: var(--on-brand); padding: 12px 16px; display: flex; align-items: center; gap: 8px; }
.band h3 { color: var(--on-brand); }
.mbody { padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); }
.levels { display: flex; flex-direction: column; gap: 10px; }
.levels li { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
textarea { width: 100%; min-height: 64px; resize: vertical; font: inherit; color: var(--ink); background: var(--surface-sunk); border: 1.5px solid var(--ink-muted); border-radius: var(--radius-sm); padding: 8px 10px; }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.check input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--success); flex: none; }
.rec { display: flex; flex-direction: column; gap: 6px; }
.rec input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
audio { width: 100%; height: 40px; }
.end { text-align: center; padding: var(--space-6) var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); align-items: center; }
.end .closing { font-family: var(--font-explain); font-size: 20px; line-height: 28px; font-weight: 700; text-wrap: balance; }
.foot { padding-block: var(--space-6); border-top: 1px solid var(--line); }
@media (prefers-reduced-motion: reduce) { .bar > span { transition: none !important; } }
</style>

orrect": "A", "options": [{"key": "A", "text": "I joined the company in 2022.", "feedback": "Simple et correct."}, {"key": "B", "text": "I work here since 2022.", "feedback": "L'anglais demande « I've been here since 2022 »."}, {"key": "C", "text": "Since four years.", "feedback": "Avec une durée : « for four years »."}]}]}, {"id": "SUA-S01-L02-A01", "type": "choose_best", "instruction": "Quelle est la meilleure réponse ?", "items": [{"n": 1, "prompt": "Kofi: “Let's do a quick round of introductions.” You have 10 seconds.", "hint": "Tour de table : vous avez 10 secondes.", "correct": "A", "options": [{"key": "A", "text": "I'm Awa, from operations. At the moment, I'm working on the new delivery process.", "feedback": "Oui : qui vous êtes et votre projet, en 10 secondes."}, {"key": "B", "text": "I'm Awa. I studied in Abidjan, then I worked in a bank for three years, then…", "feedback": "Trop long : c'est votre CV, pas une présentation."}, {"key": "C", "text": "My name is Awa and I am the coordinator of operations.", "feedback": "Compréhensible, mais lourd. En anglais, on dit généralement « operations coordinator »."}]}, {"n": 2, "prompt": "A new colleague asks: “So, what do you do?”", "hint": "Un nouveau collègue vous demande ce que vous faites.", "correct": "C", "options": [{"key": "A", "text": "I'm responsible of the suppliers.", "feedback": "Français traduit : on dit « responsible for »."}, {"key": "B", "text": "Suppliers.", "feedback": "Trop court : on ne sait pas ce que vous faites."}, {"key": "C", "text": "I look after our suppliers in West Africa.", "feedback": "Oui : clair et naturel."}]}, {"n": 3, "prompt": "Someone asks: “How long have you been here?”", "hint": "On vous demande depuis combien de temps vous êtes là.", "correct": "B", "options": [{"key": "A", "text": "Since three years.", "feedback": "Avec une durée : « for »."}, {"key": "B", "text": "I've been here for three years. I joined the company in 2023.", "feedback": "Oui : la durée avec « for », puis une date."}, {"key": "C", "text": "I am here since 2023.", "feedback": "L'anglais demande « I've been » ici : « I've been here since 2023. »"}]}]}, {"id": "SUA-S01-L02-A02", "type": "spot_the_error", "prompt": "Quelles phrases sonnent comme du français traduit ? Corrigez-les.", "items": [{"n": 1, "text": "I work here since five years.", "error": true, "fix": "I've been here for five years."}, {"n": 2, "text": "I'm Kofi, from the project team in Accra.", "error": false, "fix": null}, {"n": 3, "text": "I'm responsible of the budget.", "error": true, "fix": "I'm responsible for the budget."}, {"n": 4, "text": "I work like an accountant.", "error": true, "fix": "I work as an accountant."}, {"n": 5, "text": "I work in Kola Foods.", "error": true, "fix": "I work at Kola Foods."}]}]}, {"key": "Repeat", "label": "Répéter", "acts": [{"id": "SUA-S01-L02-A10", "type": "repeat", "instruction": "Écoutez. Répétez. Enregistrez-vous et comparez.", "checks": ["Ai-je dit l'expression en entier ?", "Ai-je dit mon nom clairement et lentement ?"]}]}, {"key": "Recall", "label": "Retrouver", "acts": [{"id": "SUA-S01-L02-A11", "type": "recall_timed", "instruction": "Lisez la situation. Réfléchissez 5 secondes. Dites votre réponse. Puis affichez la solution.", "think": 5, "items": [{"n": 1, "tier": "simple", "situation": "Round of introductions. Say your name and team.", "hint": "Tour de table. Dites votre nom et votre équipe.", "model": "I'm Awa, from the operations team."}, {"n": 2, "tier": "simple", "situation": "Say what you do every day.", "hint": "Dites ce que vous faites au quotidien.", "model": "I look after our suppliers."}, {"n": 3, "tier": "simple", "situation": "Say your current project.", "hint": "Dites votre projet du moment.", "model": "At the moment, I'm working on the new delivery process."}, {"n": 4, "tier": "simple", "situation": "Say when you started in the company.", "hint": "Dites quand vous avez commencé dans l'entreprise.", "model": "I joined the company in 2023."},   nb.classList.add("next"); main.append(nb);
}
if (D.hub) { const wm = document.querySelector(".wordmark"); const link = h("a", { href: D.hub, class: "wordmark", style: "color:inherit;text-decoration:none" }, "OYO"); const back = h("a", { href: D.hub, class: "note", style: "color:inherit" }, "← Section 1"); wm.replaceWith(h("span", { class: "row" }, link, back)); }
document.getElementById("lnum").textContent = String(D.lesson.n).padStart(2, "0");
document.getElementById("lsec").textContent = "Leçon " + D.lesson.n + " · " + D.lesson.section;
document.getElementById("ltitle").textContent = D.lesson.title;
document.getElementById("lsub").textContent = D.lesson.subtitle + " · " + D.lesson.minutes + " min";
document.getElementById("foot").textContent = "OYO · Speak Up at Work · " + D.lesson.formula.join(" → ");
if (D.clips) document.getElementById("voicenote").textContent = "Voix de synthèse (version de test). Montez le volume ; « Vitesse 0,8× » ralentit les phrases.";
const sp = document.getElementById("speed"); sp.setAttribute("aria-pressed", S.slow ? "true" : "false");
sp.addEventListener("click", () => { S.slow = !S.slow; sp.setAttribute("aria-pressed", S.slow ? "true" : "false"); save(); });
if (S.stage >= D.stages.length) S.stage = 0;
render();
}
</script>
</body></html>
