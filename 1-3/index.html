* { box-sizing: border-box; }
[hidden] { display: none !important; }

{"key": "A", "text": "I'd like to come back to the budget for a second.", "feedback": "Oui : poli et clair."}, {"key": "B", "text": "I want to come back on the budget.", "feedback": "Trop direct, et on dit « come back to »."}, {"key": "C", "text": "Budget!", "feedback": "Trop brusque."}]}]}, {"id": "SUA-S01-L03-A01", "type": "choose_best", "instruction": "Que dire de mieux à ce moment-là ?", "items": [{"n": 1, "prompt": "Kofi finishes and asks: “Any thoughts?” You have one idea.", "hint": "Kofi a fini et demande des idées. Vous en avez une.", "correct": "A", "options": [{"key": "A", "text": "Just one point from me: can we start earlier?", "feedback": "Oui : il demande des idées."}, {"key": "B", "text": "Sorry to interrupt, but can we start earlier?", "feedback": "Kofi a fini. Inutile d'interrompre."}, {"key": "C", "text": "I want to say something.", "feedback": "Trop direct, et votre idée manque."}]}, {"n": 2, "prompt": "Chidi just made a good point. You want to add to it.", "hint": "Chidi vient de dire quelque chose de bien. Vous voulez compléter.", "correct": "B", "options": [{"key": "A", "text": "I join what Chidi said.", "feedback": "Français traduit : on ne « join » pas une idée."}, {"key": "B", "text": "Just to add to what Chidi said — we could test it first.", "feedback": "Oui : le lien avec Chidi, puis votre idée."}, {"key": "C", "text": "On another topic, we could test it first.", "feedback": "Votre idée est liée, mais vous dites le contraire."}]}, {"n": 3, "prompt": "The team moved on, but nobody decided the budget.", "hint": "L'équipe est passée à autre chose, mais le budget n'est pas décidé.", "correct": "C", "options": [{"key": "A", "text": "Let's talk about the budget.", "feedback": "Possible, mais brusque."}, {"key": "B", "text": "I want to come back on the budget.", "feedback": "Trop direct, et on dit « come back to »."}, {"key": "C", "text": "I'd like to come back to the budget for a second.", "feedback": "Oui : poli et clair."}]}]}, {"id": "SUA-S01-L03-A02", "type": "spot_the_error", "prompt": "Quelles phrases sonnent comme du français traduit ? Corrigez-les.", "items": [{"n": 1, "text": "I am agree with Kofi.", "error": true, "fix": "I agree with Kofi."}, {"n": 2, "text": "Just to add to what Awa said — we need a bigger room.", "error": false, "fix": null}, {"n": 3, "text": "I join what Chidi said about the price.", "error": true, "fix": "Building on what Chidi said about the price…"}, {"n": 4, "text": "I'd like to come back on the timeline.", "error": true, "fix": "I'd like to come back to the timeline."}, {"n": 5, "text": "Actually, we work with twelve clients.", "error": true, "fix": "At the moment, we work with twelve clients."}]}]}, {"key": "Repeat", "label": "Répéter", "acts": [{"id": "SUA-S01-L03-A10", "type": "repeat", "instruction": "Écoutez. Répétez. Enregistrez-vous et comparez.", "checks": ["Ai-je dit l'expression en entier ?", "Ai-je parlé de façon aimable, sans exiger ?"]}]}, {"key": "Recall", "label": "Retrouver", "acts": [{"id": "SUA-S01-L03-A11", "type": "recall_timed", "instruction": "Lisez la situation. Réfléchissez 5 secondes. Dites votre réponse. Puis affichez la solution.", "think": 5, "items": [{"n": 1, "tier": "simple", "situation": "Kofi asks: “Any thoughts?” You have one idea.", "hint": "Kofi demande des idées. Vous en avez une.", "model": "Just one point from me: we could start earlier."}, {"n": 2, "tier": "simple", "situation": "There is a short pause. You want to speak.", "hint": "Il y a une courte pause. Vous voulez parler.", "model": "Can I add something? We need a bigger room."}, {"n": 3, "tier": "simple", "situation": "Chidi made a good point. Add to it.", "hint": "Chidi a dit quelque chose de bien. Complétez.", "model": "Just to add to what Chidi said — we could test it first."}, {"n": 4, "tier": "simple", "situation": "The team moved on. You want to talk about the budget again.", "hint": "L'équipe est passée à autre chose. Vous voulez reparler du budget.", "model": "I'd like to come back to the budget for a second."}, {"n": 5, "tier": "natural", "situation": "Everyone speaks fast. The pauses are very short.", "hint": "Tout le monde parle vite. Les pauses sont très courtes.", "model": "Can I jump in here? We could save on transport."}, {"n": 6, "tier": "polished", "situation": "A formal meeting with directors. You want to speak.", "hint": "Réunion formelle avec des directeurs. Vous voulez parler.", "model": "If I could just come in here — the budget is ready."}]}]}, {"key": "Role-play", "label": "Jeu de rôle", "acts": [{"id": "SUA-S01-L03-A12", "type": "role_play", "title": "La newsletter client", "setup": "Vous êtes Awa. L'équipe parle d'une nouvelle newsletter pour les clients.", "partner": "kofi", "role": "awa", "min_tier": null, "turns": [{"partner": "So, we send the newsletter once a month. Any thoughts?", "audio": "SUA-S01-L03-AU21", "stage": null, "end": false, "learner": {"cue": "Take your turn. Idea: send it every two weeks.", "hint": "Prenez votre tour. Idée : l'envoyer toutes les deux semaines.", "start": "Just one point from me:", "model": "Just one point from me: could we send it every two weeks?", "polished": null, "pause": 6}}, {"partner": "Every two weeks is good. Chidi also says we need short articles.", "audio": "SUA-S01-L03-AU22", "stage": null, "end": false, "learner": {"cue": "Add to Chidi's idea: add photos too.", "hint": "Ajoutez à l'idée de Chidi : mettre aussi des photos.", "start": "Just to add to what Chidi said —", "model": "Just to add to what Chidi said — we could add photos too.", "polished": null, "pause": 6}}, {"partner": "Okay, so we take option B for the design.", "audio": "SUA-S01-L03-AU23", "stage": "L'équipe parle du design pendant quelques minutes.", "end": false, "learner": {"cue": "Go back to an open point: who writes the articles?", "hint": "Revenez à un point ouvert : qui écrit les articles ?", "start": "I'd like to come back to…", "model": "I'd like to come back to the articles. Who's writing them?", "polished": null, "pause": 6}}, {"partner": "Good question. Chidi's team can do it.", "audio": "SUA-S01-L03-AU24", "stage": null, "end": true}]}, {"id": "SUA-S01-L03-A13", "type": "role_play", "title": "Le budget de l'événement", "setup": "Vous êtes Awa. Kofi et Chidi parlent vite du budget d'un événement client.", "partner": "kofi", "role": "awa", "min_tier": "natural", "turns": [{"partner": "…so that's about 900,000 francs in total.", "audio": "SUA-S01-L03-AU25", "stage": null, "end": false, "learner": {"cue": "There is a very short pause. Get in: we can save on transport.", "hint": "Pause très courte. Entrez : on peut économiser sur le transport.", "start": null, "model": "Can I jump in here? We could save on transport.", "polished": null, "pause": 5}}, {"partner": "Transport? Okay, how?", "audio": "SUA-S01-L03-AU26", "stage": null, "end": false, "learner": {"cue": "Link to the transport point: one bus is cheaper than taxis.", "hint": "Rebondissez sur le transport : un bus coûte moins cher que des taxis.", "start": null, "model": "On that point — one bus for everyone is cheaper than taxis.", "polished": null, "pause": 6}}, {"partner": "Good. The directors join the call now. Any final comments?", "audio": "SUA-S01-L03-AU27", "stage": null, "end": false, "learner": {"cue": "Formal meeting. Ask to send the budget to the directors before the event.", "hint": "Réunion formelle. Proposez d'envoyer le budget aux directeurs avant l'événement.", "start": null, "model": "If I could just come in here — can we send the budget to the directors before the event?", "polished": null, "pause": 7}}, {"partner": "Yes, let's do that.", "audio": "SUA-S01-L03-AU28", "stage": null, "end": true}]}]}, {"key": "Mission", "label": "Mission", "acts": [{"id": "SUA-S01-L03-A07", "type": "mission", "title": "Votre mission cette semaine", "task": "Cette semaine, dans une vraie réunion, prenez votre tour au moins une fois, pendant une pause, dans les dix premières minutes.", "levels": [     if (last) { save(); renderStages(); main.replaceChildren(h("section", { class: "card end" }, h("p", { class: "lnum" }, String(D.lesson.n).padStart(2, "0")),
      h("p", { class: "closing" }, D.lesson.closing), h("p", { class: "muted" }, "Leçon terminée. Faites votre mission cette semaine, puis passez à la leçon suivante."))); window.scrollTo(0, 0); return; }
    S.stage++; save(); render(); window.scrollTo(0, 0);
  });
  nb.classList.add("next"); main.append(nb);
}
if (D.hub) { const wm = document.querySelector(".wordmark"); const link = h("a", { href: D.hub, class: "wordmark", style: "color:inherit;text-decoration:none" }, "OYO"); const back = h("a", { href: D.hub, class: "note", style: "color:inherit" }, "← Section 1"); wm.replaceWith(h("span", { class: "row" }, link, back)); }
document.getElementById("lnum").textContent = D.lesson.badge || String(D.lesson.n).padStart(2, "0");
if (D.lesson.badge) document.getElementById("lnum").style.fontSize = "30px";
document.getElementById("lsec").textContent = D.lesson.kicker || ("Leçon " + D.lesson.n + " · " + D.lesson.section);
document.getElementById("ltitle").textContent = D.lesson.title;
document.getElementById("lsub").textContent = D.lesson.subtitle + " · " + D.lesson.minutes + "\u00a0min";
document.getElementById("foot").textContent = "OYO · Speak Up at Work · " + D.lesson.formula.join(" → ");
if (D.clips) document.getElementById("voicenote").textContent = "Voix de synthèse (version de test). Montez le volume ; « Vitesse 0,8× » ralentit les phrases.";
const sp = document.getElementById("speed"); sp.setAttribute("aria-pressed", S.slow ? "true" : "false");
sp.addEventListener("click", () => { S.slow = !S.slow; sp.setAttribute("aria-pressed", S.slow ? "true" : "false"); save(); });
if (S.stage >= D.stages.length) S.stage = 0;
render();
}
</script>
