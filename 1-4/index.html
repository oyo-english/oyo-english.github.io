* { box-sizing: border-box; }

button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.chip .num { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--surface-sunk); font-size: 13px; }

 you », c'est pour frapper à une porte, pas pour une réunion."}]}, {"partner": "kofi", "audio": "SUA-S01-L04-AU30", "line": "Oh — sorry, go ahead.", "need": "You want Kofi to speak first.", "hint": "Vous voulez que Kofi parle d'abord.", "stage": "Vous et Kofi commencez à parler en même temps.", "correct": "A", "options": [{"key": "A", "text": "No, you go.", "feedback": "Naturel. Pour prendre la parole à la place, dites : « Thanks — quick question… »"}, {"key": "B", "text": "Continue.", "feedback": "Seul, ça sonne comme un ordre."}, {"key": "C", "text": "I cut you, sorry.", "feedback": "Ce n'est pas de l'anglais. Dites « Sorry, go ahead » ou « No, you go »."}]}]}, {"id": "SUA-S01-L04-A01", "type": "tone_check", "prompt": "Kofi is speaking about the budget. You need to check one number. What is best?", "hint": "Kofi parle du budget. Vous devez vérifier un chiffre. Quelle est la meilleure option ?", "correct": "B", "options": [{"key": "A", "text": "Wait, wait — that number is wrong.", "feedback": "Trop fort. « Wait, wait » sonne comme une attaque."}, {"key": "B", "text": "Sorry, just quickly — is that 15,000 or 50,000?", "feedback": "Poli, court, et Kofi sait exactement ce que vous voulez."}, {"key": "C", "text": "Excuse me, I want to say something.", "feedback": "Début poli, mais « I want to say something » sonne comme une exigence. Kofi ne sait pas pourquoi vous parlez."}]}, {"id": "SUA-S01-L04-A02", "type": "spot_the_error", "prompt": "Quelles phrases sonnent comme du français traduit ? Corrigez-les.", "items": [{"n": 1, "text": "Excuse me to interrupt, but is that the final price?", "error": true, "fix": "Sorry to interrupt, but is that the final price?"}, {"n": 2, "text": "Sorry, just quickly — who is sending the report?", "error": false, "fix": null}, {"n": 3, "text": "Okay, thanks. Continue.", "error": true, "fix": "Okay, thanks. Sorry, go on."}, {"n": 4, "text": "Can I take the word for a second?", "error": true, "fix": "Sorry, just quickly — can I say one thing?"}, {"n": 5, "text": "Before you move on — the client called this morning.", "error": false, "fix": null}]}]}, {"key": "Repeat", "label": "Répéter", "acts": [{"id": "SUA-S01-L04-A10", "type": "repeat", "instruction": "Écoutez. Répétez. Enregistrez-vous et comparez.", "checks": ["Ai-je dit l'expression en entier ?", "Ai-je parlé calmement et poliment ?"]}]}, {"key": "Recall", "label": "Retrouver", "acts": [{"id": "SUA-S01-L04-A11", "type": "recall_timed", "instruction": "Lisez la situation. Réfléchissez 5 secondes. Dites votre réponse. Puis affichez la solution.", "think": 5, "items": [{"n": 1, "tier": "simple", "situation": "Kofi is speaking. You have one quick question about the date.", "hint": "Kofi parle. Vous avez une petite question sur la date.", "model": "Sorry, just quickly — what's the date?"}, {"n": 2, "tier": "simple", "situation": "You asked your question. Now Kofi can continue.", "hint": "Vous avez posé votre question. Kofi peut continuer.", "model": "Okay, thanks. Sorry, go on."}, {"n": 3, "tier": "simple", "situation": "You and Chidi start speaking at the same time.", "hint": "Vous et Chidi commencez à parler en même temps.", "model": "Sorry, go ahead."}, {"n": 4, "tier": "natural", "situation": "Your manager is going to the next topic. You need to add one thing first.", "hint": "Votre manager passe au sujet suivant. Vous devez ajouter un point avant.", "model": "Before you move on — the client called this morning."}, {"n": 5, "tier": "natural", "situation": "Kofi gives the wrong deadline. Everyone is writing it down.", "hint": "Kofi donne une mauvaise date limite. Tout le monde la note.", "model": "Can I stop you there for a second? The deadline is the 7th."}, {"n": 6, "tier": "polished", "situation": "The plan has a risk. Nobody has mentioned it.", "hint": "Le plan comporte un risque. Personne n'en a parlé.", "model": "Sorry to interrupt — I just want to flag that the supplier hasn't signed yet."}]}]}, {"key": "Role-play", "label": "Jeu de rôle", "acts": [{"id": "SUA-S01-L04-A12", "type": "role_play", "title": "L'e-mail au client", "setup": "Vous êtes Awa. Kofi prépare l'e-mail au client. Vous devez vérifier le budget.", "partner": "kofi", "role": "awa", "min_tier": null, "turns": [{"partner": "Right. So we send the final version to the client tomorrow morning, and after that we—", "audio": "SUA-S01-L04-AU21", "stage": null, "end": false, "learner": {"cue": "Interrupt. Ask: has the client approved the budget?", "hint": "Interrompez et demandez si le client a validé le budget.", "start": "Sorry, just quickly —", "model": "Sorry, just quickly — has the client approved the budget?", "polished": null, "pause": 6}}, {"partner": "Not yet. They want to see the final version first.", "audio": "SUA-S01-L04-AU22", "stage": null, "end": false, "learner": {"cue": "Say one short point. Then give the floor back.", "hint": "Dites une courte remarque, puis rendez la parole.", "start": "Okay, let's … Sorry, go on.", "model": "Okay, let's mention that in the email. Sorry, go on.", "polished": null, "pause": 7}}, {"partner": "So—", "audio": "SUA-S01-L04-AU23", "stage": "Vous et Kofi commencez à parler en même temps.", "end": false, "learner": {"cue": "Let Kofi continue.", "hint": "Laissez Kofi continuer.", "start": null, "model": "Sorry, go ahead.", "polished": null, "pause": 4}}, {"partner": "Thanks. So, after that, we book the launch call.", "audio": "SUA-S01-L04-AU24", "stage": null, "end": true}]}, {"id": "SUA-S01-L04-A13", "type": "role_play", "title": "La mauvaise date limite", "setup": "Vous êtes Awa. Chidi donne les dates limites. Vous savez que le client a avancé le rapport au 7.", "partner": "chidi", "role": "awa", "min_tier": "natural", "turns": [{"partner": "Okay, deadlines. The report is due on Friday the 10th, and the slides are due on the—", "audio": "SUA-S01-L04-AU25", "stage": null, "end": false, "learner": {"cue": "Stop him. The report is due on the 7th, not the 10th.", "hint": "Arrêtez-le : le rapport est dû le 7, pas le 10.", "start": null, "model": "Can I stop you there for a second? The report is due on the 7th, not the 10th.", "polished": "Sorry to interrupt — I just want to flag that the client moved the report to the 7th.", "pause": 7}}, {"partner": "Oh, really? Let me check… Yes, you're right. The 7th. Thanks.", "audio": "SUA-S01-L04-AU26", "stage": null, "end": false, "learner": {"cue": "Give the floor back.", "hint": "Rendez la parole.", "start": null, "model": "No problem. Sorry, go on.", "polished": null, "pause": 4}}, {"partner": "So, the slides are due on the 9th.", "audio": "SUA-S01-L04-AU27", "stage": null, "end": true}]}]}, {"key": "Mission", "label": "Mission", "acts": [{"id": "SUA-S01-L04-A07", "type": "mission", "title": "Votre mission cette semaine", "task": "Cette semaine, dans une vraie réunion ou un appel, interrompez poliment une fois. Dites votre point en une phrase. Puis rendez la parole.", "levels": [{"tier": "simple", "model": "Sorry, just quickly — [votre question]? … Okay, thanks. Sorry, go on."}, {"tier": "natural", "model": "Before you move on — [l'information]. / Can I stop you there for a second? [la correction]"}, {"tier": "polished", "model": "Sorry to interrupt — I just want to flag that [le risque]."}], "no_meeting": "Pas de réunion cette semaine ? Faites les jeux de rôle en ligne, deux fois.", "log": [{"q": "Quelle expression ai-je utilisée ?", "field": "text"}, {"q": "La personne a-t-elle continué facilement ?", "field": "text"}]}]}], "titles": {"tone_check": "Le bon ton", "spot_the_error": "Repérez le français traduit", "listen": "Écoutez", "listen_and_choose": "Écoutez et choisissez", "cover_and_recall": "Cachez et retrouvez", "role_play": "Jeu de rôle", "self_check": "Auto-évaluation"}, "audioBase": "", "audioReady": false, "hosted": true, "hub": "../1/", "clips": {"awa|Before you move on — the client called this morning.": "data:audio/mpeg;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjYwLjE2LjEwMAAAAAAAAAAAAAAA//OEwAAAAAAAAAAAAElu const INTRO = { Listen: "Écoutez avant de lire.", Choose: "Choisissez la meilleure réponse. Lisez chaque explication.", Repeat: "Écoutez chaque expression et répétez-la à voix haute.",
  Recall: "Sans regarder vos notes.", "Role-play": "Répondez à voix haute dans la pause.", Mission: "Utilisez la leçon dans une vraie réunion cette semaine." };
function renderStages() {
  const bar = document.getElementById("stages"); bar.replaceChildren();
  D.stages.forEach((st, i) => {
    const c = h("button", { class: "chip" + (S.done.includes(st.key) ? " done" : ""), type: "button", "aria-current": i === S.stage ? "step" : null },
      h("span", { class: "num" }, S.done.includes(st.key) ? ic("check", "ic--sm") : String(i + 1)), st.label);
    c.addEventListener("click", () => { S.stage = i; save(); render(); });
    bar.append(c);
    if (i === S.stage) requestAnimationFrame(() => c.scrollIntoView({ block: "nearest", inline: "center" }));
  });
}
function render() {
  stopAudio(); renderStages();
  const st = D.stages[S.stage]; const main = document.getElementById("main"); main.replaceChildren();
  main.append(h("div", { class: "stage-h" }, h("p", { class: "label" }, "Étape " + (S.stage + 1) + " sur " + D.stages.length), h("h2", {}, st.label), h("p", { class: "muted" }, INTRO[st.key] || "")));
  st.acts.forEach(a => main.append(R[a.type] ? R[a.type](a) : h("p", {}, a.type)));
  const last = S.stage === D.stages.length - 1;
  const nb = nextBtn(last ? "Terminer la leçon" : "Étape suivante : " + D.stages[S.stage + 1].label, () => {
    if (!S.done.includes(st.key)) S.done.push(st.key);
    if (last) { save(); renderStages(); main.replaceChildren(h("section", { class: "card end" }, h("p", { class: "lnum" }, String(D.lesson.n).padStart(2, "0")),
      h("p", { class: "closing" }, D.lesson.closing), h("p", { class: "muted" }, "Leçon terminée. Faites votre mission cette semaine, puis passez à la leçon suivante."))); window.scrollTo(0, 0); return; }
    S.stage++; save(); render(); window.scrollTo(0, 0);
  });
  nb.classList.add("next"); main.append(nb);
}
if (D.hub) { const wm = document.querySelector(".wordmark"); const link = h("a", { href: D.hub, class: "wordmark", style: "color:inherit;text-decoration:none" }, "OYO"); const back = h("a", { href: D.hub, class: "note", style: "color:inherit" }, "← Section 1"); wm.replaceWith(h("span", { class: "row" }, link, back)); }
document.getElementById("lnum").textContent = D.lesson.badge || String(D.lesson.n).padStart(2, "0");
if (D.lesson.badge) document.getElementById("lnum").style.fontSize = "30px";
document.getElementById("lsec").textContent = D.lesson.kicker || ("Leçon " + D.lesson.n + " · " + D.lesson.section);
document.getElementById("ltitle").textContent = D.lesson.title;
document.getElementById("lsub").textContent = D.lesson.subtitle + " · " + D.lesson.minutes + "\u00a0min";
document.getElementById("foot").textContent = "OYO · Speak Up at Work · " + D.lesson.formula.join(" → ");
if (D.clips) document.getElementById("voicenote").textContent = "Voix de synthèse (version de test). Montez le volume ; « Vitesse 0,8× » ralentit les phrases.";
const sp = document.getElementById("speed"); sp.setAttribute("aria-pressed", S.slow ? "true" : "false");
sp.addEventListener("click", () => { S.slow = !S.slow; sp.setAttribute("aria-pressed", S.slow ? "true" : "false"); save(); });
if (S.stage >= D.stages.length) S.stage = 0;
render();
}
</script>
