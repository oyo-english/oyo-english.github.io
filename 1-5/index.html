* { box-sizing: border-box; }

 "need": "Check before you act.", "hint": "Vérifiez avant d'agir.", "stage": null, "correct": "B", "options": [{"key": "A", "text": "Okay, no problem.", "feedback": "Risqué : vous ne vérifiez rien."}, {"key": "B", "text": "Just to make sure I understand — I call tomorrow, then I send the quote?", "feedback": "Oui : l'ordre des tâches est vérifié."}, {"key": "C", "text": "Repeat, please.", "feedback": "Vous avez entendu. Et « repeat » a besoin de « that »."}]}]}, {"id": "SUA-S01-L05-A01", "type": "choose_best", "instruction": "Quelle question aide le plus ? Choisissez la bonne marche de l'échelle.", "items": [{"n": 1, "prompt": "Chidi says: “We need to streamline onboarding.” You don't know “streamline”.", "hint": "Chidi utilise un mot que vous ne connaissez pas : « streamline ».", "correct": "B", "options": [{"key": "A", "text": "I don't understand.", "feedback": "Correct, mais Chidi ne sait pas quel mot bloque."}, {"key": "B", "text": "What do you mean by ‘streamline’?", "feedback": "Oui : vous nommez le mot exact."}, {"key": "C", "text": "Can you precise?", "feedback": "Ce n'est pas de l'anglais. Dites « Could you be more specific? »."}]}, {"n": 2, "prompt": "Kofi says: “We must improve the customer journey.” You heard every word, but it's too general.", "hint": "Vous avez tout entendu, mais c'est trop général.", "correct": "A", "options": [{"key": "A", "text": "Could you give me an example?", "feedback": "Oui : vous demandez du concret."}, {"key": "B", "text": "Sorry, I didn't catch that.", "feedback": "Mauvaise marche : vous avez entendu. Le problème, c'est le sens."}, {"key": "C", "text": "Okay, sure.", "feedback": "Vous faites semblant de comprendre. C'est ça, le vrai risque."}]}, {"n": 3, "prompt": "Kofi says: “So you'll send the new file to finance by Thursday.” You think you understand.", "hint": "Vous pensez avoir compris la tâche. Vérifiez avant d'agir.", "correct": "C", "options": [{"key": "A", "text": "Okay, no problem.", "feedback": "Risqué : si vous avez mal compris, personne ne le saura avant jeudi."}, {"key": "B", "text": "Could you put that another way?", "feedback": "Mauvaise marche : vous avez compris. Maintenant, confirmez."}, {"key": "C", "text": "Just to make sure I understand — the new file, to finance, by Thursday?", "feedback": "Oui : la tâche, la personne et la date, vérifiées en une phrase."}]}]}, {"id": "SUA-S01-L05-A02", "type": "spot_the_error", "prompt": "Quelles phrases sonnent comme du français traduit ? Corrigez-les.", "items": [{"n": 1, "text": "What do you want to say by ‘pipeline’?", "error": true, "fix": "What do you mean by ‘pipeline’?"}, {"n": 2, "text": "Could you give me an example?", "error": false, "fix": null}, {"n": 3, "text": "Can you precise the date?", "error": true, "fix": "Could you be more specific about the date?"}, {"n": 4, "text": "Can you explain me with an example?", "error": true, "fix": "Could you give me an example?"}, {"n": 5, "text": "So you're saying the meeting is on Monday?", "error": false, "fix": null}]}]}, {"key": "Repeat", "label": "Répéter", "acts": [{"id": "SUA-S01-L05-A10", "type": "repeat", "instruction": "Écoutez. Répétez. Enregistrez-vous et comparez.", "checks": ["Ai-je dit l'expression en entier ?", "Ma voix monte-t-elle à la fin, comme une question ?"]}]}, {"key": "Recall", "label": "Retrouver", "acts": [{"id": "SUA-S01-L05-A11", "type": "recall_timed", "instruction": "Lisez la situation. Réfléchissez 5 secondes. Dites votre réponse. Puis affichez la solution.", "think": 5, "items": [{"n": 1, "tier": "simple", "situation": "Kofi uses a word you don't know: “pipeline”.", "hint": "Kofi utilise un mot que vous ne connaissez pas : « pipeline ».", "model": "What do you mean by ‘pipeline’?"}, {"n": 2, "tier": "simple", "situation": "Chidi's explanation is too general. You need something concrete.", "hint": "L'explication de Chidi est trop générale. Il vous faut du concret.", "model": "Could you give me an example?"}, {"n": 3, "tier": "simple", "situation": "You think the report is due on Friday. Check.", "hint": "Vous pensez que le rapport est pour vendredi. Vérifiez.", "model": "So you're saying the report is due on Friday?"}, {"n": 4, "tier": "simple", "situation": "A loud noise. You didn't hear Kofi's last words.", "hint": "Un bruit fort. Vous n'avez pas entendu les derniers mots de Kofi.", "model": "Sorry, I didn't catch that."}, {"n": 5, "tier": "natural", "situation": "Kofi explained twice. It's still not clear.", "hint": "Kofi a expliqué deux fois. Ce n'est toujours pas clair.", "model": "Sorry, could you put that another way?"}, {"n": 6, "tier": "polished", "situation": "Kofi has a big new idea. You want to know how it works day to day.", "hint": "Kofi a une grande idée. Vous voulez savoir comment ça marche au quotidien.", "model": "What would that look like in practice?"}]}]}, {"key": "Role-play", "label": "Jeu de rôle", "acts": [{"id": "SUA-S01-L05-A12", "type": "role_play", "title": "Le nouveau processus de remboursement", "setup": "Vous êtes Awa. Chidi explique un nouveau processus de remboursement client.", "partner": "chidi", "role": "awa", "min_tier": null, "turns": [{"partner": "So, from Monday, all big refunds go to the escalation queue.", "audio": "SUA-S01-L05-AU21", "stage": null, "end": false, "learner": {"cue": "Ask what “escalation queue” means.", "hint": "Demandez ce que veut dire « escalation queue ».", "start": "What do you mean by…", "model": "What do you mean by ‘escalation queue’?", "polished": null, "pause": 5}}, {"partner": "It's a special list. The team leaders check those cases first.", "audio": "SUA-S01-L05-AU22", "stage": null, "end": false, "learner": {"cue": "It's still general. Ask for an example.", "hint": "C'est encore général. Demandez un exemple.", "start": null, "model": "Could you give me an example?", "polished": null, "pause": 4}}, {"partner": "Sure. A customer asks for a refund of 80,000 francs. A team leader checks it before we pay.", "audio": "SUA-S01-L05-AU23", "stage": null, "end": false, "learner": {"cue": "Check that you understand.", "hint": "Vérifiez que vous avez compris.", "start": "So… big refunds…?", "model": "So you're saying a team leader checks big refunds first?", "polished": null, "pause": 6}}, {"partner": "Exactly. Good question.", "audio": "SUA-S01-L05-AU24", "stage": null, "end": true}]}, {"id": "SUA-S01-L05-A13", "type": "role_play", "title": "La tâche floue", "setup": "Vous êtes Awa. Kofi vous donne une tâche, mais ses mots ne sont pas clairs.", "partner": "kofi", "role": "awa", "min_tier": "natural", "turns": [{"partner": "Awa, can you look into the supplier issue and circle back to me soon?", "audio": "SUA-S01-L05-AU25", "stage": null, "end": false, "learner": {"cue": "You don't know “circle back”. Ask.", "hint": "Vous ne connaissez pas « circle back ». Demandez.", "start": null, "model": "Sorry, what do you mean by ‘circle back’?", "polished": null, "pause": 5}}, {"partner": "Oh — come back to me with an answer.", "audio": "SUA-S01-L05-AU26", "stage": null, "end": false, "learner": {"cue": "“Soon” is not clear. Ask for a date.", "hint": "« Soon » n'est pas clair. Demandez une date.", "start": null, "model": "Could you be more specific? When do you need the answer?", "polished": null, "pause": 5}}, {"partner": "By Wednesday, if possible.", "audio": "SUA-S01-L05-AU27", "stage": null, "end": false, "learner": {"cue": "Confirm the task and the date.", "hint": "Confirmez la tâche et la date.", "start": null, "model": "Just to make sure I understand — I check the supplier issue and answer you by Wednesday?", "polished": null, "pause": 7}}, {"partner": "Perfect. Thanks, Awa.", "audio": "SUA-S01-L05-AU28", "stage": null, "end": true}]}]}, {"key": "Mission", "label": "Mission", "acts": [{"id": "SUA-S01-L05-A07", "type": "mission", "title": "Votre mission cette semaine", "task": "Cette semaine, quand quelque chose n'est pas clair, posez une question au lieu de faire semblant. Puis confirmez en une phrase.", "levels":
